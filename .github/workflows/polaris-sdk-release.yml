name: Polaris SDK Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified beta artifacts after protected-environment approval"
        required: true
        default: false
        type: boolean

concurrency:
  group: polaris-sdk-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify SDK artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      npm_version: ${{ steps.versions.outputs.npm_version }}
      python_version: ${{ steps.versions.outputs.python_version }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/control-plane/go.mod

      - name: Install repository dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify public contract and both SDKs
        run: |
          bun run stage7:developer:check
          bun run stage7:sdk:conformance

      - name: Build release inputs
        run: |
          bun run --cwd packages/polaris-sdk build
          bun scripts/prepare-polaris-sdk-release.ts release-staging
          mkdir -p release-artifacts/npm release-artifacts/python
          npm pack ./release-staging/npm --pack-destination ./release-artifacts/npm
          python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0 hatchling==1.27.0
          python -m build packages/polaris-python --outdir release-artifacts/python
          python -m twine check release-artifacts/python/*

      - name: Record and verify artifact contents
        id: versions
        run: |
          npm_version="$(node -p 'require("./packages/polaris-sdk/package.json").version')"
          python_version="$(python -c 'import tomllib; print(tomllib.load(open("packages/polaris-python/pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/verify_polaris_sdk_artifacts.py release-artifacts --npm-version "$npm_version" --python-version "$python_version"
          cp release-staging/release-manifest.json release-artifacts/source-manifest.json
          echo "npm_version=$npm_version" >> "$GITHUB_OUTPUT"
          echo "python_version=$python_version" >> "$GITHUB_OUTPUT"

      - name: Attest exact SDK archives
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            release-artifacts/npm/*.tgz
            release-artifacts/python/*.whl
            release-artifacts/python/*.tar.gz

      - name: Retain verified SDK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: polaris-sdk-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/**
          if-no-files-found: error
          retention-days: 14

  publish_preflight:
    name: Fail closed before requested publication
    if: ${{ inputs.publish == true }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require exact tag and both trusted publishers
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.npm_version }}
          NPM_READY: ${{ vars.POLARIS_NPM_TRUSTED_PUBLISHING_READY }}
          PYPI_READY: ${{ vars.POLARIS_PYPI_TRUSTED_PUBLISHING_READY }}
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "polaris-sdk-v$EXPECTED_VERSION"
          test "$NPM_READY" = "1"
          test "$PYPI_READY" = "1"

  publish_npm:
    name: Publish TypeScript SDK through npm OIDC
    if: ${{ inputs.publish == true }}
    needs: [build, publish_preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: polaris-npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified SDK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: polaris-sdk-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts

      - name: Setup Node trusted publisher runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag and npm trusted-publishing runtime
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.npm_version }}
        run: |
          test "$GITHUB_REF_NAME" = "polaris-sdk-v$EXPECTED_VERSION"
          node -e 'const { execFileSync } = require("node:child_process"); const [major, minor, patch] = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number); if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) throw new Error("npm >= 11.5.1 is required for trusted publishing");'

      - name: Publish npm beta with automatic provenance
        run: npm publish release-artifacts/npm/*.tgz --access public --tag beta

  publish_pypi:
    name: Publish Python SDK through PyPI OIDC
    if: ${{ inputs.publish == true }}
    needs: [build, publish_preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: polaris-pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified SDK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: polaris-sdk-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts

      - name: Verify release tag
        env:
          NPM_VERSION: ${{ needs.build.outputs.npm_version }}
        run: test "$GITHUB_REF_NAME" = "polaris-sdk-v$NPM_VERSION"

      - name: Publish Python beta with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0
        with:
          packages-dir: release-artifacts/python
