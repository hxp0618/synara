name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Format, Lint, Typecheck, Test, Browser Test, Build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Cache Bun and Turbo
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Linux terminal PTY native dependency
        if: runner.os == 'Linux'
        run: node scripts/node-pty-smoke.mjs

      - name: Verify Synara identity
        run: bun run brand:check

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Run the workspace-local playwright binary directly: bunx stalled after
      # the chromium download on hosted runners. The step timeout stops any
      # remaining apt/download stalls from eating the whole job budget.
      - name: Install browser test runtime
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          cd apps/web
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Browser test (stable)
        timeout-minutes: 20
        run: bun run --cwd apps/web test:browser:stable

      # Pixel/font/layout comparisons are tracked explicitly in
      # apps/web/BROWSER_TEST_QUARANTINE.md while their Linux rendering is fixed.
      # All untagged browser tests run in the blocking stable step above.
      - name: Browser test (Linux geometry quarantine)
        continue-on-error: true
        timeout-minutes: 10
        run: bun run --cwd apps/web test:browser:geometry

      - name: Build desktop pipeline
        run: bun run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.js
          grep -nE "desktopBridge|getWsUrl|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.js

  windows_process:
    name: Windows Process Regression
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Windows process planning
        run: bun run --cwd packages/shared test src/windowsProcess.test.ts

      - name: Test Effect Windows process spawn
        run: bun run --cwd apps/server test src/windowsProcessEffect.test.ts

      - name: Test Windows desktop backend shutdown
        run: bun run --cwd apps/desktop test src/backendShutdown.windows.integration.test.ts

      # The 0.6.0 wedge hit Windows hardest, and the repair path is built out of
      # exactly what Windows treats differently: unlinking a marker, reclaiming
      # stranded partials, and renaming a database file that may still be held
      # open. Linux-only coverage cannot speak for any of that.
      - name: Test migration recovery marker
        run: bun run --cwd packages/shared test src/migrationRecovery.test.ts

      - name: Test desktop migration recovery
        run: bun run --cwd apps/desktop test src/desktopMigrationRecovery.test.ts

      - name: Test migration backup and restore
        run: bun run --cwd apps/server test src/persistence/MigrationBackup.test.ts

      - name: Test migration replay
        run: bun run --cwd apps/server test src/persistence/Migrations/MigrationReplay.test.ts

  # Released (id, name) migration pairs are recorded in every user's
  # effect_sql_migrations table, so renumbering or renaming one corrupts existing
  # installs. This job needs the release tags, hence the unshallow checkout; the
  # guard itself is dependency-free and skips with a warning if tags are missing.
  migration_lineage:
    name: Migration Lineage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Verify released migration lineage
        run: node scripts/check-migration-lineage.ts

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify Synara identity
        run: bun run brand:check

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  control-plane:
    name: Go Control Plane
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/control-plane/go.mod
          cache-dependency-path: services/control-plane/go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      # The control plane ships to Linux hosts and Kubernetes Pods on both
      # architectures, and several agentd paths are build-tagged Linux-only, so
      # they are never compiled by a macOS or amd64-only check.
      - name: Cross-compile deployment targets
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      # -race is the only check covering the goroutine, atomic and shared-cache
      # coordination in agentd and the reconcilers. Measured at 3m11s for the
      # whole module versus 2m55s for just those packages, so it runs everywhere
      # rather than leaving the other 50 packages unguarded to save 16 seconds.
      - name: Race test
        run: go test ./... -race -count=1

      # Correctness checks only. SA covers misuse and deprecated APIs — a
      # crypto/dsa import and two tar.TypeRegA comparisons had already accreted
      # here — and S1/QF1 cover provably redundant code. ST* is excluded on
      # purpose: its 296 findings are capitalized error strings, most of them
      # user-facing problem messages where that is the house style, and U1000 is
      # excluded because build-tagged Linux-only symbols read as unused when the
      # analysis runs for another platform. Linux is checked separately since
      # that is where this ships and those files are never analysed otherwise.
      - name: Static analysis
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@latest -checks="SA*,S1*,QF1*" ./...
          GOOS=linux go run honnef.co/go/tools/cmd/staticcheck@latest -checks="SA*,S1*,QF1*" ./...

      # Two reachable advisories reached this module before anyone was checking:
      # a SAML signature bypass in goxmldsig that enterprise SSO login went
      # through, and SQL injection in pgx. Both were only found by running this
      # by hand, so it runs on every change now. It reports only advisories that
      # are actually reachable from called code, not every module in go.sum.
      - name: Vulnerability scan
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
