[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "polaris-agents"
version = "0.1.0b1"
description = "Official Python SDK for the Polaris Developer API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Synara" }]
dependencies = []

[tool.polaris]
minimum-control-plane-version = "0.1.0-beta.1"

[tool.hatch.build.targets.wheel]
packages = ["src/polaris_agents"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
