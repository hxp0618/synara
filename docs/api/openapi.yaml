components:
  securitySchemes:
    ServiceAccountBearer:
      type: http
      scheme: bearer
      bearerFormat: syna_sa_...
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated opaque key used to replay this mutation safely.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  headers:
    IdempotencyReplayed:
      description: True when the stored response for the Idempotency-Key was replayed.
      schema:
        type: boolean
    RateLimitLimit:
      description: Per-key request limit for the current UTC minute window.
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Remaining admitted requests for the key in the current window.
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Whole seconds until the current UTC minute window resets.
      schema:
        type: integer
        minimum: 1
  responses:
    ErrorResponse:
      description: Stable Polaris API error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    UUID:
      type: string
      format: uuid
    ResourceLifecycleOverrides:
      type: object
      additionalProperties: false
      properties:
        waitingKeepAliveSeconds: { type: [integer, "null"], minimum: 0 }
        suspendAfterIdleSeconds: { type: [integer, "null"], minimum: 0 }
        absoluteSessionLifetimeSeconds: { type: [integer, "null"], minimum: 0 }
        workspaceRetentionDays: { type: [integer, "null"], minimum: 0 }
        warmPoolMode: { type: [string, "null"] }
    EffectiveResourceLifecyclePolicy:
      type: object
      additionalProperties: false
      required:
        - waitingKeepAliveSeconds
        - suspendAfterIdleSeconds
        - absoluteSessionLifetimeSeconds
        - workspaceRetentionDays
        - warmPoolMode
      properties:
        waitingKeepAliveSeconds: { type: integer, minimum: 0 }
        suspendAfterIdleSeconds: { type: integer, minimum: 0 }
        absoluteSessionLifetimeSeconds: { type: [integer, "null"], minimum: 0 }
        workspaceRetentionDays: { type: integer, minimum: 0 }
        warmPoolMode: { type: string }
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [title, provider]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        visibility:
          type: string
          enum: [project, organization]
          default: project
        provider: { type: string, minLength: 1 }
        model: { type: [string, "null"] }
        providerCredentialId:
          oneOf:
            - $ref: "#/components/schemas/UUID"
            - type: "null"
          description: Machine principals may reference only non-user credential scopes they are authorized to use.
        executionTargetId:
          oneOf:
            - $ref: "#/components/schemas/UUID"
            - type: "null"
        executionTargetGroupId:
          oneOf:
            - $ref: "#/components/schemas/UUID"
            - type: "null"
        preferredExecutionRegion: { type: [string, "null"] }
        resourceLifecyclePolicy:
          oneOf:
            - $ref: "#/components/schemas/ResourceLifecycleOverrides"
            - type: "null"
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - organizationId
        - projectId
        - createdBy
        - title
        - status
        - visibility
        - provider
        - model
        - providerCredentialId
        - executionTargetId
        - requestedExecutionTargetId
        - lastEventSequence
        - resourceState
        - meaningfulActivityAt
        - resourceLifecyclePolicy
        - createdAt
        - updatedAt
        - archivedAt
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        tenantId: { $ref: "#/components/schemas/UUID" }
        organizationId: { $ref: "#/components/schemas/UUID" }
        projectId: { $ref: "#/components/schemas/UUID" }
        createdBy: { $ref: "#/components/schemas/UUID" }
        title: { type: string }
        status: { type: string }
        visibility: { type: string, enum: [project, organization] }
        provider: { type: string }
        model: { type: [string, "null"] }
        providerCredentialId:
          oneOf:
            - $ref: "#/components/schemas/UUID"
            - type: "null"
