openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Polaris Developer API
  version: 0.1.0-beta.1
  description: >-
    Public developer contract for the Synara control plane. Operations marked
    route-only participate in exposure conformance but are not yet eligible for SDK generation.
servers:
  - url: /
paths:
  /v1/artifacts/{artifactID}:
    delete:
      operationId: deleteArtifact
      summary: Idempotently delete an Artifact and revoke its grants
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      x-synara-request-body: none
      parameters:
        - name: artifactID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - $ref: "#/components/parameters/IdempotencyKey"
      security:
        - ServiceAccountBearer: []
      responses:
        "204":
          description: Artifact deleted, or already deleted by the same authorized caller
          headers:
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
        default:
          $ref: "#/components/responses/ErrorResponse"
    get:
      operationId: getArtifact
      summary: Get Artifact metadata
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      parameters:
        - name: artifactID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      security:
        - ServiceAccountBearer: []
      responses:
        "200":
          description: Artifact metadata without payload bytes or grant credentials
          headers:
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/artifacts/{artifactID}/complete:
    post:
      operationId: completeArtifact
      summary: Confirm an uploaded Artifact by size, digest, and media type
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      parameters:
        - name: artifactID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteArtifactRequest" }
      security:
        - ServiceAccountBearer: []
      responses:
        "200":
          description: Ready Artifact; an identical confirmation is intrinsically replay-safe
          headers:
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/artifacts/{artifactID}/download:
    post:
      operationId: downloadArtifact
      summary: Issue a short-lived Artifact download grant
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      x-synara-request-body: none
      parameters:
        - name: artifactID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      security:
        - ServiceAccountBearer: []
      responses:
        "200":
          description: Short-lived download grant; payload bytes remain outside the JSON API
          headers:
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactDownloadGrant" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/executions/{executionID}/approvals/{requestID}/resolve:
    post:
      operationId: resolveExecutionApproval
      summary: Resolve a pending execution approval
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      parameters:
        - name: executionID
          in: path
          required: true
          schema:
            type: string
        - name: requestID
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveApprovalRequest"
      security:
        - ServiceAccountBearer: []
      responses:
        "200":
          description: Approval resolution accepted or idempotently replayed
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interaction"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/executions/{executionID}/cancel:
    post:
      operationId: cancelExecution
      summary: Cancel an active or queued Execution
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      x-synara-request-body: none
      parameters:
        - name: executionID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - $ref: "#/components/parameters/IdempotencyKey"
      security:
        - ServiceAccountBearer: []
      responses:
        "200":
          description: Cancelled Execution or idempotently replayed response
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeveloperExecution" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/executions/{executionID}/interactions:
    get:
      operationId: listExecutionInteractions
      summary: List an Execution's Interaction history
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      parameters:
        - name: executionID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1 }
      security:
        - ServiceAccountBearer: []
      responses:
        "200":
          description: Bounded Interaction history page without Worker delivery internals
          headers:
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InteractionPage" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/executions/{executionID}/resume:
    post:
      operationId: resumeActiveTurnExecution
      summary: Resume an idle-suspended active Turn by Execution ID
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      x-synara-request-body: none
      parameters:
        - name: executionID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - $ref: "#/components/parameters/IdempotencyKey"
      security:
        - ServiceAccountBearer: []
      responses:
        "202":
          description: Recovering Execution or idempotently replayed response
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeveloperExecution" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/executions/{executionID}/user-input/{requestID}/resolve:
    post:
      operationId: resolveExecutionUserInput
      summary: Resolve a structured user-input Interaction
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      parameters:
        - name: executionID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: requestID
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveUserInputRequest" }
      security:
        - ServiceAccountBearer: []
      responses:
        "200":
          description: Structured user input resolved or idempotently replayed
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interaction" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/projects/{projectID}:
    delete:
      operationId: archiveProject
      summary: Archive a Project
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      x-synara-request-body: none
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - $ref: "#/components/parameters/IdempotencyKey"
      security:
        - ServiceAccountBearer: []
      responses:
        "204":
          description: Project archived or idempotently replayed
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
        default:
          $ref: "#/components/responses/ErrorResponse"
    get:
      operationId: getProject
      summary: Get a Project
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      security:
        - ServiceAccountBearer: []
      responses:
        "200":
          description: Project
          headers:
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default:
          $ref: "#/components/responses/ErrorResponse"
    patch:
      operationId: updateProject
      summary: Update a Project
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectRequest" }
      security:
        - ServiceAccountBearer: []
      responses:
        "200":
          description: Updated Project or idempotently replayed response
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/projects/{projectID}/provider-capabilities:
    get:
      operationId: projectProviderCapabilities
      summary: Read the sanitized Provider capability matrix for a Project target
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: executionTargetId
          in: query
          schema:
            $ref: "#/components/schemas/UUID"
      security:
        - ServiceAccountBearer: []
      responses:
        "200":
          description: Sanitized target-based Provider capability matrix
          headers:
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCapabilityProjection" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/projects/{projectID}/sessions:
    get:
      operationId: listProjectSessions
      summary: List Sessions in a Project
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1 }
      security:
        - ServiceAccountBearer: []
      responses:
        "200":
          description: Bounded Session page ordered by most recent update
          headers:
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionPage" }
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createSession
      summary: Create a Session in a Project
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      security:
        - ServiceAccountBearer: []
      responses:
        "201":
          description: Session created or idempotently replayed
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/sessions/{sessionID}:
    get:
      operationId: getAgentSession
      summary: Get a Session
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      security:
        - ServiceAccountBearer: []
      responses:
        "200":
          description: Session
          headers:
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/sessions/{sessionID}/archive:
    post:
      operationId: archiveSession
      summary: Archive a Session
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      x-synara-request-body: none
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - $ref: "#/components/parameters/IdempotencyKey"
      security:
        - ServiceAccountBearer: []
      responses:
        "200":
          description: Archived Session or idempotently replayed response
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/sessions/{sessionID}/artifacts:
    get:
      operationId: listArtifacts
      summary: List Artifact metadata for a Session
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1 }
      security:
        - ServiceAccountBearer: []
      responses:
        "200":
          description: Bounded Artifact metadata page ordered newest first
          headers:
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactPage" }
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createArtifact
      summary: Create pending Artifact metadata and a short-lived upload grant
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateArtifactRequest" }
      security:
        - ServiceAccountBearer: []
      responses:
        "201":
          description: Pending Artifact with a fresh short-lived grant, or ready metadata on replay
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactUploadGrant" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/sessions/{sessionID}/compact:
    post:
      operationId: compactSession
      summary: Queue a native-cursor Session compaction
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompactSessionRequest" }
      security:
        - ServiceAccountBearer: []
      responses:
        "202":
          description: Compaction operation queued or idempotently replayed
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeveloperQueuedSessionOperation" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/sessions/{sessionID}/events:
    get:
      operationId: listSessionEvents
      summary: List durable Session Events after a sequence
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: afterSequence
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      security:
        - ServiceAccountBearer: []
      responses:
        "200":
          description: Ordered durable Session Event page
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEventPage"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/sessions/{sessionID}/events/stream:
    get:
      operationId: streamSessionEvents
      summary: Stream resumable Session Events
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      x-synara-sse-event-schema: "#/components/schemas/SessionEvent"
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: afterSequence
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: Last-Event-ID
          in: header
          required: false
          description: Used as the resume cursor when afterSequence is absent.
          schema:
            type: string
            pattern: "^[0-9]+$"
      security:
        - ServiceAccountBearer: []
      responses:
        "200":
          description: Resumable Session Event stream
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                sessionEvent:
                  value: |-
                    id: 42
                    event: session-event
                    data: {"eventId":"f3d95da2-af9f-4c38-98df-55a743be910d","eventVersion":1,"tenantId":"9074a58b-fad0-41ea-bc73-773867d98d72","organizationId":"fcdb7dd0-ab4c-454a-8ba2-b99ef5e87ab7","projectId":"74e7ab78-ecc1-4a54-a605-7582303058e8","sessionId":"3bf04193-a157-4829-811d-054be6802b23","executionId":null,"workerId":null,"generation":null,"sequence":42,"eventType":"session.created","actorType":"service_account","actorId":"2bfa3f0c-e8de-484f-a12f-4b9f393f8d8e","payload":{},"occurredAt":"2026-08-03T12:00:00Z"}
        default:
          $ref: "#/components/responses/ErrorResponse"
  /v1/sessions/{sessionID}/fork:
    post:
      operationId: forkSession
      summary: Fork an idle Session at an exact Event sequence
      x-synara-exposure: public-beta
      x-synara-contract-status: codegen-ready
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForkSessionRequest" }
      security:
        - ServiceAccountBearer: []
      responses:
