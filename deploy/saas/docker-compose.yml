services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synara}
      POSTGRES_USER: ${POSTGRES_USER:-synara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/saas/.env}
    volumes:
      - synara-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_HOST_PORT:-59000}:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in deploy/saas/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/saas/.env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${SYNARA_ARTIFACT_CORS_ALLOW_ORIGIN:?Set the exact browser origin in deploy/saas/.env}
    volumes:
      - synara-minio:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in deploy/saas/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/saas/.env}
      MINIO_ARTIFACT_USER: ${MINIO_ARTIFACT_USER:?Set MINIO_ARTIFACT_USER in deploy/saas/.env}
      MINIO_ARTIFACT_PASSWORD: ${MINIO_ARTIFACT_PASSWORD:?Set MINIO_ARTIFACT_PASSWORD in deploy/saas/.env}
      SYNARA_ARTIFACT_BUCKET: ${SYNARA_ARTIFACT_BUCKET:-synara-artifacts}
    volumes:
      - ./minio:/bootstrap:ro

  control-plane:
    build:
      context: ../../services/control-plane
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      SYNARA_DEPLOYMENT_PROFILE: single-node
      SYNARA_METADATA_STORE: postgresql
      SYNARA_ARTIFACT_STORE: minio
      SYNARA_QUEUE_DRIVER: postgres-outbox
      SYNARA_CONTROL_PLANE_REPLICAS: "1"
      SYNARA_DATABASE_URL: postgres://${POSTGRES_USER:-synara}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-synara}?sslmode=disable
      SYNARA_DATABASE_MAX_OPEN_CONNECTIONS: ${SYNARA_DATABASE_MAX_OPEN_CONNECTIONS:-20}
      SYNARA_DATABASE_MAX_IDLE_CONNECTIONS: ${SYNARA_DATABASE_MAX_IDLE_CONNECTIONS:-5}
      SYNARA_DATABASE_CONNECTION_MAX_LIFETIME: ${SYNARA_DATABASE_CONNECTION_MAX_LIFETIME:-1h}
      SYNARA_DATABASE_CONNECTION_MAX_IDLE_TIME: ${SYNARA_DATABASE_CONNECTION_MAX_IDLE_TIME:-15m}
      SYNARA_DATABASE_MIGRATION_LOCK_TIMEOUT: ${SYNARA_DATABASE_MIGRATION_LOCK_TIMEOUT:-30s}
      SYNARA_CONTROL_PLANE_LISTEN: 0.0.0.0:3780
      SYNARA_CONTROL_PLANE_DEV_BOOTSTRAP: ${SYNARA_CONTROL_PLANE_DEV_BOOTSTRAP:-false}
      SYNARA_LOGIN_COOKIE_SECURE: ${SYNARA_LOGIN_COOKIE_SECURE:-true}
      SYNARA_LOGIN_COOKIE_DOMAIN: ${SYNARA_LOGIN_COOKIE_DOMAIN:-}
      SYNARA_LOGIN_COOKIE_PATH: ${SYNARA_LOGIN_COOKIE_PATH:-/}
      SYNARA_LOGIN_COOKIE_SAME_SITE: ${SYNARA_LOGIN_COOKIE_SAME_SITE:-lax}
      SYNARA_LOGIN_SESSION_TTL: ${SYNARA_LOGIN_SESSION_TTL:-720h}
      SYNARA_LOGIN_SESSION_IDLE_TTL: ${SYNARA_LOGIN_SESSION_IDLE_TTL:-168h}
      SYNARA_TRUSTED_PROXY_CIDRS: ${SYNARA_TRUSTED_PROXY_CIDRS:-}
      SYNARA_WORKER_REGISTRATION_TOKEN: ${SYNARA_WORKER_REGISTRATION_TOKEN:?Set SYNARA_WORKER_REGISTRATION_TOKEN in deploy/saas/.env}
      SYNARA_WORKER_LEASE_TTL: ${SYNARA_WORKER_LEASE_TTL:-30s}
      SYNARA_WORKER_HEARTBEAT_TIMEOUT: ${SYNARA_WORKER_HEARTBEAT_TIMEOUT:-90s}
      SYNARA_WORKER_RECEIPT_TTL: ${SYNARA_WORKER_RECEIPT_TTL:-24h}
      SYNARA_PROVIDER_CREDENTIAL_ACCESS_TTL: ${SYNARA_PROVIDER_CREDENTIAL_ACCESS_TTL:-5m}
      SYNARA_PLATFORM_OPERATOR_TENANT_ID: ${SYNARA_PLATFORM_OPERATOR_TENANT_ID:?Set SYNARA_PLATFORM_OPERATOR_TENANT_ID in deploy/saas/.env}
      SYNARA_COST_ACCOUNTING_OPERATOR_TENANT_ID: ${SYNARA_COST_ACCOUNTING_OPERATOR_TENANT_ID:-}
      SYNARA_COST_ACCOUNTING_BLOB_SOURCE: ${SYNARA_COST_ACCOUNTING_BLOB_SOURCE:-disabled}
      SYNARA_COST_ACCOUNTING_LOCAL_BASE_DIR: ${SYNARA_COST_ACCOUNTING_LOCAL_BASE_DIR:-}
      SYNARA_COST_ACCOUNTING_S3_BUCKET: ${SYNARA_COST_ACCOUNTING_S3_BUCKET:-}
      SYNARA_COST_ACCOUNTING_S3_REGION: ${SYNARA_COST_ACCOUNTING_S3_REGION:-us-east-1}
      SYNARA_COST_ACCOUNTING_S3_ENDPOINT: ${SYNARA_COST_ACCOUNTING_S3_ENDPOINT:-}
      SYNARA_COST_ACCOUNTING_S3_USE_PATH_STYLE: ${SYNARA_COST_ACCOUNTING_S3_USE_PATH_STYLE:-false}
      SYNARA_COST_ACCOUNTING_S3_ALLOW_CUSTOM_ENDPOINT: ${SYNARA_COST_ACCOUNTING_S3_ALLOW_CUSTOM_ENDPOINT:-false}
      SYNARA_COST_ACCOUNTING_S3_ALLOW_HTTP: ${SYNARA_COST_ACCOUNTING_S3_ALLOW_HTTP:-false}
      SYNARA_COST_ACCOUNTING_GCS_BUCKET: ${SYNARA_COST_ACCOUNTING_GCS_BUCKET:-}
      SYNARA_COST_ACCOUNTING_AZURE_CONTAINER_URL: ${SYNARA_COST_ACCOUNTING_AZURE_CONTAINER_URL:-}
      SYNARA_COST_ACCOUNTING_AZURE_ALLOW_HTTP: ${SYNARA_COST_ACCOUNTING_AZURE_ALLOW_HTTP:-false}
      SYNARA_COST_ACCOUNTING_BLOB_PREFIX: ${SYNARA_COST_ACCOUNTING_BLOB_PREFIX:-}
      SYNARA_COST_ACCOUNTING_MAX_OBJECT_BYTES: ${SYNARA_COST_ACCOUNTING_MAX_OBJECT_BYTES:-0}
      SYNARA_COST_ACCOUNTING_IMPORT_MAPPINGS_JSON: ${SYNARA_COST_ACCOUNTING_IMPORT_MAPPINGS_JSON:-[]}
      SYNARA_COST_ACCOUNTING_SHARED_ALLOCATION_MAPPINGS_JSON: ${SYNARA_COST_ACCOUNTING_SHARED_ALLOCATION_MAPPINGS_JSON:-[]}
      SYNARA_WORKER_LEASES_ENABLED: "true"
      SYNARA_WORKER_FENCING_ENABLED: "true"
      SYNARA_PROVIDER_CURSOR_KEY: ${SYNARA_PROVIDER_CURSOR_KEY:?Set SYNARA_PROVIDER_CURSOR_KEY in deploy/saas/.env}
      SYNARA_PROVIDER_CURSOR_KEY_ID: ${SYNARA_PROVIDER_CURSOR_KEY_ID:-}
      SYNARA_PROVIDER_CURSOR_DECRYPT_KEYS_JSON: ${SYNARA_PROVIDER_CURSOR_DECRYPT_KEYS_JSON:-}
      SYNARA_PROVIDER_CURSOR_KEY_OLD_V1: ${SYNARA_PROVIDER_CURSOR_KEY_OLD_V1:-}
      SYNARA_PROVIDER_CURSOR_MAX_AGE: ${SYNARA_PROVIDER_CURSOR_MAX_AGE:-720h}
      SYNARA_CREDENTIAL_KMS_PROVIDER: ${SYNARA_CREDENTIAL_KMS_PROVIDER:-local}
      SYNARA_CREDENTIAL_KMS_KEY_ID: ${SYNARA_CREDENTIAL_KMS_KEY_ID:-single-node-local-v1}
      SYNARA_CREDENTIAL_MASTER_KEY: ${SYNARA_CREDENTIAL_MASTER_KEY:-}
      SYNARA_CREDENTIAL_KMS_AWS_REGION: ${SYNARA_CREDENTIAL_KMS_AWS_REGION:-}
      SYNARA_CREDENTIAL_KMS_DECRYPT_KEYS_JSON: ${SYNARA_CREDENTIAL_KMS_DECRYPT_KEYS_JSON:-}
      SYNARA_CREDENTIAL_MASTER_KEY_OLD_V1: ${SYNARA_CREDENTIAL_MASTER_KEY_OLD_V1:-}
      AWS_ACCESS_KEY_ID: ${SYNARA_CONTROL_PLANE_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${SYNARA_CONTROL_PLANE_AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${SYNARA_CONTROL_PLANE_AWS_SESSION_TOKEN:-}
      SYNARA_PUBLIC_CONTROL_PLANE_URL: ${SYNARA_PUBLIC_CONTROL_PLANE_URL:-}
      SYNARA_PUBLIC_ADMIN_URL: ${SYNARA_PUBLIC_ADMIN_URL:-http://127.0.0.1:3774}
      SYNARA_INTERNAL_STATUS_BOARD_URL: ${SYNARA_INTERNAL_STATUS_BOARD_URL:-}
      SYNARA_INTERNAL_INCIDENT_PUBLISHER_URL: ${SYNARA_INTERNAL_INCIDENT_PUBLISHER_URL:-}
      SYNARA_INTERNAL_INCIDENT_PUBLISHER_HMAC_KEY_ID: ${SYNARA_INTERNAL_INCIDENT_PUBLISHER_HMAC_KEY_ID:-}
      SYNARA_INTERNAL_INCIDENT_PUBLISHER_HMAC_KEY: ${SYNARA_INTERNAL_INCIDENT_PUBLISHER_HMAC_KEY:-}
      SYNARA_INTERNAL_INCIDENT_PUBLISHER_TIMEOUT: ${SYNARA_INTERNAL_INCIDENT_PUBLISHER_TIMEOUT:-10s}
      SYNARA_COMMERCIALIZATION_MODE: ${SYNARA_COMMERCIALIZATION_MODE:-internal-self-hosted}
      SYNARA_SSH_PROVISION_TIMEOUT: ${SYNARA_SSH_PROVISION_TIMEOUT:-2m}
      SYNARA_DOCKER_RECONCILE_INTERVAL: ${SYNARA_DOCKER_RECONCILE_INTERVAL:-10s}
      SYNARA_DOCKER_WORKER_OBSERVABILITY_ROOT: ${SYNARA_DOCKER_WORKER_OBSERVABILITY_ROOT:-}
      SYNARA_SSH_WORKER_OBSERVABILITY_ROOT: ${SYNARA_SSH_WORKER_OBSERVABILITY_ROOT:-}
      SYNARA_KUBERNETES_RECONCILE_INTERVAL: ${SYNARA_KUBERNETES_RECONCILE_INTERVAL:-5s}
      SYNARA_KUBERNETES_POD_PENDING_FAILURE_THRESHOLD: ${SYNARA_KUBERNETES_POD_PENDING_FAILURE_THRESHOLD:-2m}
      SYNARA_PLATFORM_ROUTING_PUBLISHERS_JSON: ${SYNARA_PLATFORM_ROUTING_PUBLISHERS_JSON:-[]}
      SYNARA_WORKER_AUTO_ROLLBACK_ENABLED: ${SYNARA_WORKER_AUTO_ROLLBACK_ENABLED:-true}
      SYNARA_WORKER_AUTO_ROLLBACK_INTERVAL: ${SYNARA_WORKER_AUTO_ROLLBACK_INTERVAL:-10s}
      SYNARA_RETENTION_SWEEP_INTERVAL: ${SYNARA_RETENTION_SWEEP_INTERVAL:-1h}
      SYNARA_METRIC_ROLLUP_INTERVAL: ${SYNARA_METRIC_ROLLUP_INTERVAL:-1m}
      SYNARA_METRIC_ROLLUP_BATCH_SIZE: ${SYNARA_METRIC_ROLLUP_BATCH_SIZE:-500}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      SYNARA_OTEL_TRACE_SAMPLE_RATIO: ${SYNARA_OTEL_TRACE_SAMPLE_RATIO:-0.1}
      SYNARA_OTEL_COLLECTOR_REGION: ${SYNARA_OTEL_COLLECTOR_REGION:-}
      SYNARA_OTEL_TRACE_RETENTION_DAYS: ${SYNARA_OTEL_TRACE_RETENTION_DAYS:-30}
      SYNARA_OUTBOX_POLL_INTERVAL: ${SYNARA_OUTBOX_POLL_INTERVAL:-500ms}
      SYNARA_OUTBOX_CLAIM_TTL: ${SYNARA_OUTBOX_CLAIM_TTL:-30s}
      SYNARA_OUTBOX_BATCH_SIZE: ${SYNARA_OUTBOX_BATCH_SIZE:-50}
      SYNARA_OUTBOX_MAX_ATTEMPTS: ${SYNARA_OUTBOX_MAX_ATTEMPTS:-12}
      SYNARA_OUTBOX_BASE_BACKOFF: ${SYNARA_OUTBOX_BASE_BACKOFF:-1s}
      SYNARA_OUTBOX_MAX_BACKOFF: ${SYNARA_OUTBOX_MAX_BACKOFF:-5m}
      SYNARA_SSE_POLL_INTERVAL: ${SYNARA_SSE_POLL_INTERVAL:-2s}
      SYNARA_SSE_HEARTBEAT_INTERVAL: ${SYNARA_SSE_HEARTBEAT_INTERVAL:-15s}
      SYNARA_SSE_WRITE_TIMEOUT: ${SYNARA_SSE_WRITE_TIMEOUT:-10s}
      SYNARA_SSE_LEASE_TTL: ${SYNARA_SSE_LEASE_TTL:-45s}
      SYNARA_SSE_MAX_CONNECTIONS_PER_USER: ${SYNARA_SSE_MAX_CONNECTIONS_PER_USER:-4}
      SYNARA_SSE_MAX_CONNECTIONS_PER_TENANT: ${SYNARA_SSE_MAX_CONNECTIONS_PER_TENANT:-200}
      SYNARA_ARTIFACT_ENDPOINT: http://minio:9000
      SYNARA_ARTIFACT_PUBLIC_ENDPOINT: http://${MINIO_PUBLIC_HOST:-127.0.0.1}:${MINIO_HOST_PORT:-59000}
      SYNARA_ARTIFACT_BUCKET: ${SYNARA_ARTIFACT_BUCKET:-synara-artifacts}
      SYNARA_ARTIFACT_REGION: ${SYNARA_ARTIFACT_REGION:-us-east-1}
      SYNARA_ARTIFACT_ACCESS_KEY_ID: ${MINIO_ARTIFACT_USER}
      SYNARA_ARTIFACT_SECRET_ACCESS_KEY: ${MINIO_ARTIFACT_PASSWORD}
      SYNARA_ARTIFACT_USE_PATH_STYLE: "true"
      SYNARA_ARTIFACT_PRESIGN_TTL: ${SYNARA_ARTIFACT_PRESIGN_TTL:-15m}
      SYNARA_ARTIFACT_MAX_UPLOAD_BYTES: ${SYNARA_ARTIFACT_MAX_UPLOAD_BYTES:-2147483648}
    healthcheck:
      test: ["CMD", "/usr/local/bin/control-plane", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  admin:
    image: ${SYNARA_ADMIN_IMAGE:-synara-admin:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: admin-runtime
      args:
        SYNARA_ADMIN_ENABLE_DEV_LOGIN: ${SYNARA_ADMIN_ENABLE_DEV_LOGIN:-false}
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "${SYNARA_ADMIN_BIND_ADDRESS:-127.0.0.1}:${SYNARA_ADMIN_HOST_PORT:-3774}:3774"
    environment:
      SYNARA_ADMIN_HOST: 0.0.0.0
      SYNARA_ADMIN_PORT: "3774"
      SYNARA_CONTROL_PLANE_URL: http://control-plane:3780
      SYNARA_TENANT_APP_URL: ${SYNARA_PUBLIC_WEB_URL:-http://127.0.0.1:3773}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3774/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  synara:
    image: ${SYNARA_IMAGE:-synara-self-hosted:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
      args:
        GITHUB_DOWNLOAD_PREFIX: ${GITHUB_DOWNLOAD_PREFIX:-}
        SYNARA_UID: ${SYNARA_UID:-1000}
        SYNARA_GID: ${SYNARA_GID:-1000}
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    working_dir: /workspace
    ports:
      - "${SYNARA_BIND_ADDRESS:-127.0.0.1}:${SYNARA_HOST_PORT:-3773}:3773"
    environment:
      HOME: /home/synara
      SYNARA_HOME: /home/synara/.synara
      SYNARA_MODE: web
      SYNARA_HOST: 0.0.0.0
      SYNARA_PORT: "3773"
      SYNARA_NO_BROWSER: "1"
      SYNARA_AUTO_BOOTSTRAP_PROJECT_FROM_CWD: "0"
      SYNARA_AUTH_TOKEN: ${SYNARA_AUTH_TOKEN:?Set SYNARA_AUTH_TOKEN in deploy/saas/.env}
      SYNARA_CONTROL_PLANE_URL: http://control-plane:3780
      SYNARA_PUBLIC_URL: ${SYNARA_PUBLIC_URL:-}
      SYNARA_ALLOW_INSECURE_REMOTE: ${SYNARA_ALLOW_INSECURE_REMOTE:-false}
    volumes:
      - synara-home:/home/synara
      - type: bind
        source: ${SYNARA_WORKSPACE_PATH:-./workspace}
        target: /workspace
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3773/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  synara-home:
  synara-postgres:
  synara-minio:
