kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    labels:
      synara.io/resilience-node: worker-a
      synara.io/resilience-dependency: "true"
      topology.kubernetes.io/zone: kind-zone-a
  - role: worker
    labels:
      synara.io/resilience-node: worker-b
      topology.kubernetes.io/zone: kind-zone-b
  - role: worker
    labels:
      synara.io/resilience-node: worker-c
      topology.kubernetes.io/zone: kind-zone-c
