apiVersion: apps/v1
kind: Deployment
metadata:
  name: synara-platform-admin
  labels:
    app.kubernetes.io/name: synara-platform-admin
    app.kubernetes.io/part-of: synara
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synara-platform-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synara-platform-admin
        app.kubernetes.io/part-of: synara
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: synara-platform-admin
      containers:
        - name: admin
          image: synara-admin:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3774
          env:
            - name: SYNARA_ADMIN_HOST
              value: 0.0.0.0
            - name: SYNARA_ADMIN_PORT
              value: "3774"
            - name: SYNARA_CONTROL_PLANE_URL
              value: http://synara-control-plane:3780
            - name: SYNARA_TENANT_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: tenant-web-url
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
