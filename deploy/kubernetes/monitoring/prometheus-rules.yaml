apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: synara-control-plane
  namespace: synara-system
  labels:
    app.kubernetes.io/name: synara-control-plane
    app.kubernetes.io/part-of: synara
spec:
  groups:
    - name: synara-control-plane.availability
      rules:
        - alert: SynaraControlPlaneUnavailable
          expr: sum(up{service="synara-control-plane"}) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Synara control plane is unavailable
            description: Prometheus has not scraped a healthy Synara control-plane replica for two minutes.
        - alert: SynaraControlPlaneHighErrorRate
          expr: |
            sum(rate(synara_http_requests_total{status=~"5.."}[5m]))
              /
            clamp_min(sum(rate(synara_http_requests_total[5m])), 0.001) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Synara control-plane error rate is above 5 percent
            description: Server-side HTTP failures have exceeded 5 percent for ten minutes.
        - alert: SynaraControlPlaneHighLatency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(synara_http_request_duration_seconds_bucket[5m]))
            ) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Synara control-plane p95 latency is above two seconds
            description: Control-plane request latency has remained elevated for ten minutes.
        - alert: SynaraDatabaseConnectionSaturation
          expr: |
            sum(synara_database_connections{state="in_use"})
              /
            clamp_min(sum(synara_database_connections{state="max_open"}), 1) > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Synara database connection pools are saturated
            description: More than 90 percent of configured database connections have been in use for five minutes.
    - name: synara-control-plane.runtime
      rules:
        - alert: SynaraBackgroundFailures
          expr: increase(synara_background_failures_total[10m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Synara background reconciliation is failing
            description: A Docker, Kubernetes, or retention background run failed in the last ten minutes.
        - alert: SynaraExpiredWorkerLeases
          expr: synara_worker_leases{state="expired"} > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Synara has expired Worker leases awaiting recovery
            description: One or more expired Worker leases remain in authoritative metadata.
        - alert: SynaraWorkerOfflineSurge
          expr: sum(synara_workers{status="offline"}) >= 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Synara Worker offline count is surging
            description: At least three Workers have remained offline for five minutes.
        - alert: SynaraExecutionRecoverySurge
          expr: sum(synara_executions{status="recovering"}) >= 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Synara Execution recovery count is surging
            description: At least five Executions have remained recovering for five minutes.
        - alert: SynaraOutboxBacklog
          expr: synara_outbox_pending > 1000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Synara outbox backlog is growing
            description: More than 1000 unpublished outbox messages have remained pending for ten minutes.
        - alert: SynaraOutboxOldestAge
          expr: synara_outbox_oldest_pending_seconds > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Synara outbox delivery is delayed
            description: The oldest pending outbox message has been waiting for more than five minutes.
        - alert: SynaraOutboxDeadLetters
          expr: synara_outbox_dead_letter > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Synara outbox has dead-letter messages
            description: One or more lifecycle messages exhausted all publish attempts and require operator review.
        - alert: SynaraArtifactFailureRate
          expr: |
            sum(rate(synara_artifact_operations_total{result="failure"}[5m]))
              /
            clamp_min(sum(rate(synara_artifact_operations_total[5m])), 0.001) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Synara Artifact operations are failing
            description: More than five percent of Artifact lifecycle operations have failed for ten minutes.
        - alert: SynaraSSECatchupDelay
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(synara_sse_catchup_duration_seconds_bucket[5m]))
            ) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Synara SSE catch-up is delayed
            description: PostgreSQL-backed SSE catch-up p95 latency has exceeded five seconds for five minutes.
        - alert: SynaraExpiredSSELeases
          expr: synara_sse_connections{state="expired"} > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Synara has expired SSE connection leases
            description: Expired SSE leases remain and should be removed by reconnect or retention cleanup.
    - name: synara-control-plane.fast-provision-slo
      rules:
        - record: synara:execution_target_capacity:sum
          expr: sum by (target_kind, resource, state) (synara_execution_target_capacity)
        - record: synara:execution_target_schedulable_units:sum
          expr: sum by (target_kind) (synara_execution_target_schedulable_units)
        - record: synara:execution_queue_depth:sum
          expr: sum by (target_kind, capacity_class, queue_class) (synara_execution_queue_depth)
        - record: synara:execution_queue_oldest_age_seconds:max
          expr: max by (target_kind, capacity_class, queue_class) (synara_execution_queue_oldest_age_seconds)
        - record: synara:worker_pool_autoscaling_units:sum
          expr: sum by (capacity_class, kind) (synara_worker_pool_autoscaling_units)
        - alert: SynaraExecutionTargetCapacityAuthorityExpired
          expr: sum by (target_kind, resource) (synara_execution_target_capacity_authorities{freshness="expired"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Execution Target capacity authority is stale
            description: At least one self-hosted Target has stopped publishing a fresh resource-capacity vector.
        - alert: SynaraInteractiveColdStartGateViolated
          expr: sum by (capacity_class) (synara_worker_pool_cold_start_gate{status="violated"}) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Interactive cold-start hard ceiling was violated
            description: One or more interactive Pools have an overdue, still-unclaimed Execution and require capacity or provisioning investigation.
        - alert: SynaraOutboxAdmissionThrottled
          expr: synara_outbox_pressure_state{status="throttled"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: New Execution admission is throttled by Outbox pressure
            description: Recovery and terminal events remain admissible, but new Execution admission is blocked until the durable Outbox backlog drains.
        - alert: SynaraWarmHitColdStartSLOBreach
          expr: |
            max by (target_kind, warm_pool_mode) (
              synara_execution_cold_start_duration_seconds_30d{warm_pool_result="hit", quantile="p95"}
            ) > 2.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Warm-hit agent start P95 exceeds the interactive SLO
            description: Trailing-30-day dispatch-to-Provider-ready P95 for warm-pool hits has exceeded 2.5 seconds for 15 minutes; the fast-provision interactive SLO is breached even when warm capacity is available.
        - alert: SynaraWarmPoolFallbackSurge
          expr: |
            sum(synara_warm_pool_acquisitions_30d{result="fallback"})
              /
            clamp_min(sum(synara_warm_pool_acquisitions_30d{result=~"hit|fallback"}), 1)
            > 0.2
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Warm Pool requests are frequently falling back to cold starts
            description: More than twenty percent of warm-requested Generations in the trailing 30-day window fell back to cold provisioning; warm capacity is undersized or unhealthy relative to interactive demand.
        - alert: SynaraWarmPoolMinIdleDeficit
          expr: sum by (capacity_class) (synara_worker_pool_warm_deficit) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: A guaranteed warm floor is unmet
            description: The guaranteed warm floor has remained unmet for this capacity class for at least ten minutes; inspect target Pod budget, scheduling, and Worker readiness.
    - name: synara-enterprise-slo.recording
      interval: 1m
      rules:
        - record: synara:slo_availability_good:ratio_30d
          expr: avg(avg_over_time(probe_success{job="synara-public-readiness"}[30d]))
        - record: synara:slo_availability_samples:count_30d
          expr: sum(count_over_time(probe_success{job="synara-public-readiness"}[30d]))
        - record: synara:slo_availability_error_budget_remaining:ratio_30d
          expr: clamp_max(clamp_min(1 - ((1 - synara:slo_availability_good:ratio_30d) / 0.001), 0), 1)
        - record: synara:slo_api_latency_good:ratio_30d
          expr: |
            sum(increase(synara_http_request_duration_seconds_bucket{route!~"^/(health|ready|metrics)$",le="2.5"}[30d]))
              /
            sum(increase(synara_http_request_duration_seconds_count{route!~"^/(health|ready|metrics)$"}[30d]))
        - record: synara:slo_api_latency_samples:count_30d
          expr: sum(increase(synara_http_request_duration_seconds_count{route!~"^/(health|ready|metrics)$"}[30d]))
        - record: synara:slo_api_latency_error_budget_remaining:ratio_30d
          expr: clamp_max(clamp_min(1 - ((1 - synara:slo_api_latency_good:ratio_30d) / 0.01), 0), 1)
        - record: synara:slo_execution_start_good:ratio_30d
          expr: |
            sum(increase(synara_execution_generation_provider_ready_duration_seconds_bucket{recovery_reason="initial-claim",le="60"}[30d]))
              /
            sum(increase(synara_execution_generation_provider_ready_duration_seconds_count{recovery_reason="initial-claim"}[30d]))
        - record: synara:slo_execution_start_samples:count_30d
          expr: sum(increase(synara_execution_generation_provider_ready_duration_seconds_count{recovery_reason="initial-claim"}[30d]))
        - record: synara:slo_execution_start_error_budget_remaining:ratio_30d
          expr: clamp_max(clamp_min(1 - ((1 - synara:slo_execution_start_good:ratio_30d) / 0.01), 0), 1)
        - record: synara:slo_event_delay_good:ratio_30d
          expr: |
            sum(increase(synara_session_event_append_duration_seconds_bucket{result="success",le="1"}[30d]))
              /
            sum(increase(synara_session_event_append_duration_seconds_count{result="success"}[30d]))
        - record: synara:slo_event_delay_samples:count_30d
          expr: sum(increase(synara_session_event_append_duration_seconds_count{result="success"}[30d]))
        - record: synara:slo_event_delay_error_budget_remaining:ratio_30d
          expr: clamp_max(clamp_min(1 - ((1 - synara:slo_event_delay_good:ratio_30d) / 0.001), 0), 1)
    - name: synara-enterprise-slo.alerts
      rules:
        - alert: SynaraPublicReadinessProbeMissing
          expr: absent(probe_success{job="synara-public-readiness"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Public readiness probes are missing
            description: No external public-readiness probe series has been observed for fifteen minutes; Availability is not assessable and cannot be reported as passing.
        - alert: SynaraAvailabilityFastBudgetBurn
          expr: |
            (
              (1 - avg(avg_over_time(probe_success{job="synara-public-readiness"}[5m]))) / 0.001 > 14.4
            )
              and
            (
              (1 - avg(avg_over_time(probe_success{job="synara-public-readiness"}[1h]))) / 0.001 > 14.4
            )
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Availability error budget is burning rapidly
            description: Both the five-minute and one-hour public-readiness burn rates exceed 14.4 times the 99.9 percent Availability budget.
        - alert: SynaraAPILatencyFastBudgetBurn
          expr: |
            (
              1 - (
                sum(rate(synara_http_request_duration_seconds_bucket{route!~"^/(health|ready|metrics)$",le="2.5"}[5m]))
                  /
                sum(rate(synara_http_request_duration_seconds_count{route!~"^/(health|ready|metrics)$"}[5m]))
              )
            ) / 0.01 > 14.4
              and
            (
              1 - (
                sum(rate(synara_http_request_duration_seconds_bucket{route!~"^/(health|ready|metrics)$",le="2.5"}[1h]))
                  /
                sum(rate(synara_http_request_duration_seconds_count{route!~"^/(health|ready|metrics)$"}[1h]))
              )
            ) / 0.01 > 14.4
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: API latency error budget is burning rapidly
            description: Both the five-minute and one-hour API latency burn rates exceed 14.4 times the 99 percent latency budget.
        - alert: SynaraAvailabilityBudgetLow
          expr: synara:slo_availability_error_budget_remaining:ratio_30d <= 0.25
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Availability error budget is at or below 25 percent
            description: Pause nonessential risky rollout and assign a recovery owner under the Stage 6 error-budget policy.
        - alert: SynaraAPILatencyBudgetLow
          expr: synara:slo_api_latency_error_budget_remaining:ratio_30d <= 0.25
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: API latency error budget is at or below 25 percent
            description: Pause nonessential risky rollout and assign a recovery owner under the Stage 6 error-budget policy.
        - alert: SynaraExecutionStartBudgetLow
          expr: synara:slo_execution_start_error_budget_remaining:ratio_30d <= 0.25
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Execution Start Delay error budget is at or below 25 percent
            description: Review queue age and terminal-before-ready outcomes, pause risky rollout, and assign a recovery owner.
        - alert: SynaraEventDelayBudgetLow
          expr: synara:slo_event_delay_error_budget_remaining:ratio_30d <= 0.25
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Event Delay error budget is at or below 25 percent
            description: Review append, Outbox, and SSE companion signals, pause risky rollout, and assign a recovery owner.
