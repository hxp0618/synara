apiVersion: v1
kind: Secret
metadata:
  name: synara-control-plane-secrets
  namespace: synara-system
type: Opaque
stringData:
  database-url: postgresql://replace-me
  worker-registration-token: replace-me
  # Base64 text representing a random 32-byte key; the value itself remains a
  # string here because the application decodes it after reading the env var.
  provider-cursor-key: replace-me
  # Separate base64 text representing another random 32-byte key. Never reuse
  # provider-cursor-key; rotate through the credential re-encryption workflow.
  credential-master-key: replace-me
  # Base64 text for a dedicated random 32-byte HMAC key used only to sign
  # employee-safe incident webhook envelopes. Leave empty while the relay is disabled.
  internal-incident-publisher-hmac-key: ""
  # Artifact S3 credentials are intentionally absent. Bind the
  # synara-control-plane ServiceAccount to a bucket-scoped workload identity.
  # Required only when otel-exporter-otlp-endpoint is enabled. Materialize a
  # dedicated client identity issued for this deployment; do not reuse an
  # ingress, database or Worker certificate/key pair.
  otel-client-certificate: ""
  otel-client-key: ""
