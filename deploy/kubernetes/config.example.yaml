apiVersion: v1
kind: ConfigMap
metadata:
  name: synara-control-plane-config
  namespace: synara-system
data:
  public-control-plane-url: https://synara.example.com
  # Set to the ingress/load-balancer CIDRs that append X-Forwarded-For.
  trusted-proxy-cidrs: ""
  artifact-bucket: synara-artifacts
  artifact-region: local
  artifact-endpoint: https://minio.synara-storage.svc.cluster.local:9000
  artifact-public-endpoint: https://objects.synara.example.com
  artifact-use-path-style: "true"
  # Native cloud billing import is outside the supported self-hosted profile.
  # Keep this disabled; the operator Tenant owns versioned tariffs, shared
  # Target Coverage seals, and scheduled estimate/allocation audits.
  billing-tariff-operator-tenant-id: ""
  billing-blob-source: disabled
  # Public keys and exact Target/DR scope only. Publisher private keys must
  # remain in the external probe/replication workload and never enter this ConfigMap.
  platform-routing-publishers-json: "[]"
