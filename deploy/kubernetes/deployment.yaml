apiVersion: apps/v1
kind: Deployment
metadata:
  name: synara-control-plane
  labels:
    app.kubernetes.io/name: synara-control-plane
    app.kubernetes.io/part-of: synara
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synara-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synara-control-plane
        app.kubernetes.io/part-of: synara
    spec:
      serviceAccountName: synara-control-plane
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: synara-control-plane
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: synara-control-plane
      containers:
        - name: control-plane
          image: synara-control-plane:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3780
          env:
            - name: SYNARA_DEPLOYMENT_PROFILE
              value: enterprise
            - name: SYNARA_METADATA_STORE
              value: postgresql
            - name: SYNARA_ARTIFACT_STORE
              value: s3
            - name: SYNARA_QUEUE_DRIVER
              value: postgres-outbox
            - name: SYNARA_CONTROL_PLANE_REPLICAS
              value: "2"
            - name: SYNARA_CONTROL_PLANE_LISTEN
              value: 0.0.0.0:3780
            - name: SYNARA_PUBLIC_CONTROL_PLANE_URL
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: public-control-plane-url
            - name: SYNARA_PUBLIC_ADMIN_URL
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: public-admin-url
            - name: SYNARA_INTERNAL_STATUS_BOARD_URL
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: internal-status-board-url
            - name: SYNARA_INTERNAL_INCIDENT_PUBLISHER_URL
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: internal-incident-publisher-url
            - name: SYNARA_INTERNAL_INCIDENT_PUBLISHER_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: synara-control-plane-secrets
                  key: internal-incident-publisher-hmac-key
                  optional: true
            - name: SYNARA_INTERNAL_INCIDENT_PUBLISHER_TIMEOUT
              value: 10s
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: otel-exporter-otlp-endpoint
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: otel-exporter-otlp-protocol
            - name: OTEL_EXPORTER_OTLP_CERTIFICATE
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: otel-exporter-otlp-certificate
            - name: OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE
              value: /var/run/secrets/synara/otel/client.crt
            - name: OTEL_EXPORTER_OTLP_CLIENT_KEY
              value: /var/run/secrets/synara/otel/client.key
            - name: SYNARA_OTEL_TRACE_SAMPLE_RATIO
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: otel-trace-sample-ratio
            - name: SYNARA_OTEL_COLLECTOR_REGION
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: otel-collector-region
            - name: SYNARA_OTEL_TRACE_RETENTION_DAYS
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: otel-trace-retention-days
            - name: SYNARA_COMMERCIALIZATION_MODE
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: commercialization-mode
            - name: SYNARA_LOGIN_COOKIE_SECURE
              value: "true"
            - name: SYNARA_LOGIN_COOKIE_PATH
              value: /
            - name: SYNARA_LOGIN_COOKIE_SAME_SITE
              value: lax
            - name: SYNARA_LOGIN_SESSION_TTL
              value: 720h
            - name: SYNARA_LOGIN_SESSION_IDLE_TTL
              value: 168h
            - name: SYNARA_TRUSTED_PROXY_CIDRS
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: trusted-proxy-cidrs
            - name: SYNARA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: synara-control-plane-secrets
                  key: database-url
            - name: SYNARA_DATABASE_MAX_OPEN_CONNECTIONS
              value: "20"
            - name: SYNARA_DATABASE_MAX_IDLE_CONNECTIONS
              value: "5"
            - name: SYNARA_DATABASE_CONNECTION_MAX_LIFETIME
              value: 1h
            - name: SYNARA_DATABASE_CONNECTION_MAX_IDLE_TIME
              value: 15m
            - name: SYNARA_DATABASE_MIGRATION_LOCK_TIMEOUT
              value: 30s
            - name: SYNARA_WORKER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: synara-control-plane-secrets
                  key: worker-registration-token
            - name: SYNARA_PROVIDER_CURSOR_KEY
              valueFrom:
                secretKeyRef:
                  name: synara-control-plane-secrets
                  key: provider-cursor-key
            - name: SYNARA_PROVIDER_CURSOR_MAX_AGE
              value: 720h
            - name: SYNARA_PROVIDER_CREDENTIAL_ACCESS_TTL
              value: 5m
            - name: SYNARA_PLATFORM_OPERATOR_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: platform-operator-tenant-id
            - name: SYNARA_CREDENTIAL_KMS_PROVIDER
              value: local
            - name: SYNARA_CREDENTIAL_KMS_KEY_ID
              value: local-v1
            - name: SYNARA_CREDENTIAL_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: synara-control-plane-secrets
                  key: credential-master-key
            - name: SYNARA_ARTIFACT_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: artifact-bucket
            - name: SYNARA_ARTIFACT_REGION
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: artifact-region
            - name: SYNARA_ARTIFACT_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: artifact-endpoint
            - name: SYNARA_ARTIFACT_PUBLIC_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: artifact-public-endpoint
            - name: SYNARA_ARTIFACT_USE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: artifact-use-path-style
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: SYNARA_COST_ACCOUNTING_OPERATOR_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: cost-accounting-operator-tenant-id
                  optional: true
            - name: SYNARA_COST_ACCOUNTING_BLOB_SOURCE
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: cost-accounting-blob-source
                  optional: true
            - name: SYNARA_KUBERNETES_RECONCILE_INTERVAL
              value: 5s
            - name: SYNARA_DOCKER_WORKER_OBSERVABILITY_ROOT
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: docker-worker-observability-root
            - name: SYNARA_SSH_WORKER_OBSERVABILITY_ROOT
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: ssh-worker-observability-root
            - name: SYNARA_KUBERNETES_POD_PENDING_FAILURE_THRESHOLD
              value: 2m
            - name: SYNARA_WORKER_POOL_AUTOSCALING_INTERVAL
              value: 5s
            - name: SYNARA_WORKER_POOL_AUTOSCALING_BATCH_SIZE
              value: "200"
            - name: SYNARA_PLATFORM_ROUTING_PUBLISHERS_JSON
              valueFrom:
                configMapKeyRef:
                  name: synara-control-plane-config
                  key: platform-routing-publishers-json
                  optional: true
            - name: SYNARA_WORKER_AUTO_ROLLBACK_ENABLED
              value: "true"
            - name: SYNARA_WORKER_AUTO_ROLLBACK_INTERVAL
              value: 10s
            - name: SYNARA_METRIC_ROLLUP_INTERVAL
              value: 1m
            - name: SYNARA_METRIC_ROLLUP_BATCH_SIZE
              value: "500"
            - name: SYNARA_OUTBOX_POLL_INTERVAL
              value: 500ms
            - name: SYNARA_OUTBOX_CLAIM_TTL
              value: 30s
            - name: SYNARA_OUTBOX_BATCH_SIZE
              value: "50"
            - name: SYNARA_OUTBOX_MAX_BATCH_SIZE
              value: "500"
            - name: SYNARA_OUTBOX_MAX_CONCURRENCY
              value: "8"
            - name: SYNARA_OUTBOX_SCALE_UP_DEPTH
              value: "100"
            - name: SYNARA_OUTBOX_TARGET_DELAY
              value: 5s
            - name: SYNARA_OUTBOX_THROTTLE_DEPTH
              value: "100000"
            - name: SYNARA_OUTBOX_MAX_ATTEMPTS
              value: "12"
            - name: SYNARA_OUTBOX_BASE_BACKOFF
              value: 1s
            - name: SYNARA_OUTBOX_MAX_BACKOFF
              value: 5m
            - name: SYNARA_SSE_POLL_INTERVAL
              value: 2s
            - name: SYNARA_SSE_HEARTBEAT_INTERVAL
              value: 15s
            - name: SYNARA_SSE_WRITE_TIMEOUT
              value: 10s
            - name: SYNARA_SSE_LEASE_TTL
              value: 45s
            - name: SYNARA_SSE_MAX_CONNECTIONS_PER_USER
              value: "4"
            - name: SYNARA_SSE_MAX_CONNECTIONS_PER_TENANT
              value: "200"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: otel-client-identity
              mountPath: /var/run/secrets/synara/otel
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: otel-client-identity
          secret:
            secretName: synara-control-plane-secrets
            defaultMode: 0440
            items:
              - key: otel-client-certificate
                path: client.crt
              - key: otel-client-key
                path: client.key
